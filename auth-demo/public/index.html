<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1rem; margin: 1.5rem 0 .75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: .6rem .75rem;
      margin-bottom: .6rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: .9rem;
    }
    button {
      width: 100%;
      padding: .6rem;
      border: none;
      border-radius: 6px;
      background: #6366f1;
      color: white;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #334155; margin-top: .4rem; }
    button.danger { background: #b91c1c; }
    .row { display: flex; gap: .5rem; }
    .row button { width: auto; flex: 1; }
    #log {
      margin-top: 1rem;
      padding: .75rem;
      background: #0f172a;
      border-radius: 6px;
      font-family: monospace;
      font-size: .75rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow-y: auto;
      color: #a5f3fc;
    }
    #todos { list-style: none; margin-top: .5rem; }
    #todos li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .5rem .75rem;
      background: #0f172a;
      border-radius: 6px;
      margin-bottom: .4rem;
      font-size: .85rem;
    }
    #todos li button { width: auto; padding: .25rem .6rem; font-size: .75rem; }
    .hidden { display: none; }
    .built { text-align: center; color: #34d399; font-size: .8rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JWT Auth Demo</h1>

    <div id="authSection">
      <h2>Signup</h2>
      <input type="text" id="signupUsername" placeholder="username" />
      <input type="password" id="signupPassword" placeholder="password" />
      <button onclick="signup()">Sign up</button>

      <h2>Signin</h2>
      <input type="text" id="signinUsername" placeholder="username" />
      <input type="password" id="signinPassword" placeholder="password" />
      <button onclick="signin()">Sign in</button>

      <h2>Sum server</h2>
      <div class="row">
        <input type="text" id="sumA" placeholder="a" />
        <input type="text" id="sumB" placeholder="b" />
      </div>
      <button class="secondary" onclick="doSum()">GET /sum?a=&amp;b=</button>
    </div>

    <div id="appSection" class="hidden">
      <h2>My todos</h2>
      <div class="row">
        <input type="text" id="newTodo" placeholder="new todo" />
        <button onclick="addTodo()">Add</button>
      </div>
      <ul id="todos"></ul>
      <h2>Who am I?</h2>
      <button class="secondary" onclick="whoAmI()">GET /me</button>
      <button class="danger" onclick="logout()">Logout</button>
    </div>

    <div id="log">Ready. Sign up a user first.</div>
    <div class="built" id="builtMsg"></div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    const log = document.getElementById('log');
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const todosEl = document.getElementById('todos');
    const builtMsg = document.getElementById('builtMsg');

    function print(msg) {
      log.textContent = msg;
    }

    async function request(path, options = {}) {
      const token = localStorage.getItem('token');
      if (token) {
        options.headers = { ...options.headers, Authorization: token };
      }
      const res = await fetch(API + path, options);
      let data = null;
      try { data = await res.json(); } catch (e) {}
      print(`Status: ${res.status}\nPath: ${path}\nBody: ${JSON.stringify(data)}`);
      return { res, data };
    }

    async function signup() {
      const username = document.getElementById('signupUsername').value;
      const password = document.getElementById('signupPassword').value;
      await request('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
    }

    async function signin() {
      const username = document.getElementById('signinUsername').value;
      const password = document.getElementById('signinPassword').value;
      const { res, data } = await request('/signin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok && data.token) {
        localStorage.setItem('token', data.token);
        document.getElementById('signinUsername').value = '';
        document.getElementById('signinPassword').value = '';
        showApp();
      }
    }

    async function whoAmI() {
      await request('/me');
    }

    async function loadTodos() {
      const { res, data } = await request('/todos');
      if (!res.ok) return;
      todosEl.innerHTML = '';
      if (!data.length) {
        todosEl.innerHTML = '<li>No todos yet. Add one.</li>';
        return;
      }
      data.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t.title;
        const del = document.createElement('button');
        del.textContent = 'delete';
        del.onclick = () => deleteTodo(t.id);
        li.appendChild(del);
        todosEl.appendChild(li);
      });
    }

    async function addTodo() {
      const title = document.getElementById('newTodo').value;
      if (!title) return;
      await request('/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      document.getElementById('newTodo').value = '';
      loadTodos();
    }

    async function deleteTodo(id) {
      await request('/todos/' + id, { method: 'DELETE' });
      loadTodos();
    }

    async function doSum() {
      const a = document.getElementById('sumA').value;
      const b = document.getElementById('sumB').value;
      await request('/sum?a=' + a + '&b=' + b);
    }

    function showApp() {
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      print('Signed in. Token stored in localStorage and now sent as: Authorization: ' + localStorage.getItem('token').slice(0, 30) + '...');
      loadTodos();
    }

    function logout() {
      localStorage.removeItem('token');
      appSection.classList.add('hidden');
      authSection.classList.remove('hidden');
      print('Logged out. Token removed from localStorage.');
    }
  </script>
</body>
</html>
